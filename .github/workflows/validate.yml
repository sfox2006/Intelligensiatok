name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check posts and the feed index
        run: node scripts/validate.mjs
      - name: Check the validator itself
        run: node scripts/validate.mjs --self-test
